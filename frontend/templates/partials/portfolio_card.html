{% load i18n %}
{% load static %}
<div class="portfolio-card">
    <div class="portfolio-card-img">
        {% if portfolio.thumbnail %}
            <img src="{{ portfolio.thumbnail.url }}"
                 alt="{{ portfolio.title }}"
                 loading="lazy">
        {% else %}
            <div class="portfolio-card-fallback">
                <i class="fas fa-image"></i>
            </div>
        {% endif %}
    </div>
    {% if portfolio.is_featured %}
        <span class="portfolio-card-featured">{% trans "Featured" %}</span>
    {% endif %}
    <div class="portfolio-card-body">
        <h5>{{ portfolio.title }}</h5>
    </div>
    <a class="portfolio-card-link"
       href="{% url 'frontend:portfolio_detail' portfolio.pk %}"
       aria-label="{{ portfolio.title }}"></a>
    {% if portfolio.external_link %}
        <a class="portfolio-card-360"
           href="{{ portfolio.external_link }}"
           target="_blank"
           rel="noopener"
           aria-label="{% trans 'View in 360' %}"
           title="{% trans 'View in 360' %}">
            <i class="fas fa-vr-cardboard"></i><span>360&deg;</span>
        </a>
    {% endif %}
</div>
