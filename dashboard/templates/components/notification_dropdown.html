{% load i18n %}
<div class="dropdown notification-dropdown">
    <a href="#"
       class="nt-trigger position-relative dropdown-toggle no-caret p-2 rounded-3 d-inline-flex align-items-center justify-content-center"
       data-bs-toggle="dropdown"
       aria-label="{% trans "Notifications" %}">
        <i class="fas fa-bell"></i>
        <span id="notification-badge"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-white border-2 {% if not notifications %}d-none{% endif %}">
            {{ notifications|length }}
        </span>
    </a>
    <div class="dropdown-menu dropdown-menu-end p-0 nt-menu border-0">
        <div class="nt-header d-flex justify-content-between align-items-center px-3 py-3">
            <h6 class="mb-0 fw-bold text-light">{% trans "Notifications" %}</h6>
            <span id="notification-count"
                  class="badge nt-count rounded-pill small px-2">{{ notifications|length }} {% trans "New" %}</span>
        </div>
        <div class="notification-list nt-list">
            {% for note in notifications %}
                <a class="dropdown-item p-3 nt-item d-flex gap-3 align-items-start whitespace-normal"
                   href="#">
                    <div class="icon-circle bg-{{ note.type }}-soft text-light">
                        <i class="fas {% if note.type == 'warning' %}fa-exclamation-triangle{% elif note.type == 'success' %}fa-check-circle{% else %}fa-info-circle{% endif %}"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="small fw-bold text-light">{{ note.title }}</span>
                            <span class="smaller text-light opacity-75">{{ note.time }}</span>
                        </div>
                        <p class="small text-light opacity-75 mb-0 line-clamp-2">{{ note.message }}</p>
                    </div>
                </a>
            {% empty %}
                <div class="px-4 py-5 text-center text-muted notification-empty">
                    <div class="mb-3 opacity-25">
                        <i class="fas fa-bell-slash fa-3x"></i>
                    </div>
                    <p class="small mb-0">{% trans "You're all caught up!" %}</p>
                </div>
            {% endfor %}
        </div>
        <div class="nt-footer px-3 py-3 text-center">
            <a href="#"
               id="mark-all-read"
               class="nt-mark-read small text-decoration-none fw-bold">{% trans "Mark all as read" %}</a>
        </div>
    </div>
</div>
