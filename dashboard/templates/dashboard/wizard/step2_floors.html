{% load i18n %}
{% load static %}
<div class="wizard-step" data-step="1">
  <div class="text-center mb-4">
    <h2 class="wiz-step-title">{% trans "Configure Your Floors" %}</h2>
    <p class="wiz-step-sub">{% trans "Add, rename, reorder, or remove floors for your project" %}</p>
  </div>

  <div id="floorsContainer">
    <div class="wiz-floor-item" data-floor-index="0">
      <div class="wiz-floor-grip"><i class="fas fa-grip-vertical"></i></div>
      <div class="flex-grow-1">
        <input type="text" class="wiz-floor-input" value="{% trans 'Ground Floor' %}" placeholder="{% trans 'Floor name' %}">
      </div>
      <button type="button" class="wiz-floor-remove" title="{% trans 'Remove floor' %}">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <div class="d-flex gap-2 mt-3">
    <button type="button" class="wiz-btn wiz-btn-outline" id="addFloorBtn">
      <i class="fas fa-plus me-2"></i>{% trans "Add Floor" %}
    </button>
    <button type="button" class="wiz-btn wiz-btn-outline" id="duplicateFloorBtn">
      <i class="fas fa-copy me-2"></i>{% trans "Duplicate Last" %}
    </button>
  </div>

  <div class="mt-3">
    <small class="text-muted" style="font-size:0.75rem;">{% trans "Common: Ground Floor, First Floor, Second Floor, Basement, Roof" %}</small>
  </div>
</div>

<script src="{% static 'js/wizard-steps.js' %}?v={% now "U" %}"></script>
