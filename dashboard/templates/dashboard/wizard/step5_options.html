{% load i18n %}{% load l10n %}
<div class="wizard-step" data-step="4">
  <div class="text-center mb-4">
    <h2 class="wiz-step-title">{% trans "Extra Services" %}</h2>
    <p class="wiz-step-sub">{% trans "Add optional services to your design request" %}</p>
  </div>

  <div class="row g-2" id="optionsContainer">
    {% for opt in options %}
    <div class="col-md-6">
      <div class="wiz-opt-card option-checkbox-card" data-option-id="{{ opt.id }}" data-price="{{ opt.price|unlocalize }}">
        <div class="wiz-opt-check"><i class="fas fa-check" style="font-size:0.55rem;"></i></div>
        <div class="flex-grow-1">
          <div class="wiz-opt-name">{{ opt.name }}</div>
          <div class="wiz-opt-desc">{{ opt.description|truncatewords:8 }}</div>
        </div>
        <div class="wiz-opt-price">{{ opt.price }} DA</div>
        <input type="checkbox" class="d-none option-checkbox">
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="mt-4">
    <div class="wiz-total-bar">
      <span class="wiz-total-label">{% trans "Options Total" %}</span>
      <span class="wiz-total-value" id="optionsTotal">0 DA</span>
    </div>
  </div>
</div>
