{% load i18n %}
<div class="wizard-step text-center" data-step="9">
  <div class="py-5">
    <div class="wiz-confirm-icon mb-4">
      <i class="fas fa-check-circle"></i>
    </div>
    <h2 class="fw-bold mb-2" style="color:var(--wiz-text);">{% trans "Request Submitted Successfully!" %}</h2>
    <p class="text-muted mb-4" style="font-size:0.9rem;">{% trans "Your design request has been received." %}</p>

    <div class="wiz-confirm-card mb-4">
      <div class="mb-3">
        <span class="text-muted small">{% trans "Project Number" %}</span>
        <div class="wiz-confirm-number" id="confirmProjectNumber">—</div>
      </div>
      <div class="mb-0">
        <span class="text-muted small">{% trans "Estimated Total" %}</span>
        <div class="fs-3 fw-bold mt-1" style="color:var(--wiz-success);" id="confirmTotal">—</div>
      </div>
    </div>

    <div>
      <p class="text-muted" style="font-size:0.85rem;">
        <i class="fas fa-envelope me-2"></i>
        {% trans "A confirmation email has been sent to your email address." %}
      </p>
      <a href="/dashboard/my-projects/" class="wiz-btn wiz-btn-primary d-inline-block mt-2">
        <i class="fas fa-tachometer-alt me-2"></i>{% trans "Go to My Dashboard" %}
      </a>
    </div>
  </div>
</div>
